name: Desktop release

# A signed release of the Windows app, published to the shop's server so every installed copy
# updates itself (tauri-plugin-updater; endpoint and public key in tauri.conf.json).
#
# Runs only for a tag `desktop-v<version>`, and the version must equal tauri.conf.json's. The
# installer is uploaded before latest.json, so an app never reads a manifest that points at a file
# that is not there yet. Files land in /var/www/organza-desktop/ on the VPS, which nginx serves at
# https://api.organza-moda.com/desktop/ (see docs/handover.md, "Desktop releases").

on:
  push:
    tags: ['desktop-v*']

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  UPDATE_BASE_URL: https://api.organza-moda.com/desktop
  REMOTE_DIR: /var/www/organza-desktop

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Tag must match tauri.conf.json
        run: |
          conf=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          tag="${GITHUB_REF_NAME#desktop-v}"
          if [ "$conf" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $conf"
            exit 1
          fi
          echo "version=$conf" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @organza/shared build
      - run: pnpm --filter @organza/web build:desktop
      - name: Build and sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @organza/desktop tauri build
      - name: Write latest.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          dir=apps/desktop/src-tauri/target/release/bundle/nsis
          exe=$(ls "$dir"/*-setup.exe | head -n1)
          name=$(basename "$exe")
          cp "$exe" "$exe.sig" release/
          NAME="$name" SIG_FILE="$exe.sig" node -e '
            const fs = require("fs");
            const manifest = {
              version: process.env.VERSION,
              notes: `Organza ${process.env.VERSION}`,
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": {
                  signature: fs.readFileSync(process.env.SIG_FILE, "utf8").trim(),
                  url: `${process.env.UPDATE_BASE_URL}/${process.env.NAME}`,
                },
              },
            };
            fs.writeFileSync("release/latest.json", JSON.stringify(manifest, null, 2));
          '
          cat release/latest.json
      - uses: actions/upload-artifact@v4
        with:
          name: organza-desktop-release
          path: release/
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: organza-desktop-release
          path: release
      - name: Upload the installer first
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'release/*.exe,release/*.exe.sig'
          target: ${{ env.REMOTE_DIR }}
          strip_components: 1
      - name: Then the manifest
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'release/latest.json'
          target: ${{ env.REMOTE_DIR }}
          strip_components: 1
      - name: Check what installed apps will see
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          served=$(curl -fsS "$UPDATE_BASE_URL/latest.json" | jq -r .version)
          url=$(curl -fsS "$UPDATE_BASE_URL/latest.json" | jq -r '.platforms["windows-x86_64"].url')
          test "$served" = "$VERSION" || { echo "::error::served $served, expected $VERSION"; exit 1; }
          curl -fsSI "$url" > /dev/null
          echo "Published $VERSION at $url"
