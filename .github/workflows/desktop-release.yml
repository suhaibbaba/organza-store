name: Desktop Release (Windows)

# Builds the two Windows installers (admin + POS) from desktop/ and publishes
# them as a GitHub release. The apps are a window around the DEPLOYED sites —
# nothing from admin/ or pos/ is compiled in except their icons — so this only
# needs to run when desktop/ itself changes, never on an ordinary deploy.
on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

permissions:
  contents: write # to create the release and upload the installers

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

env:
  TAURI_CLI: "@tauri-apps/cli@2.12.4"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # One job, two builds: the second reuses everything the first compiled
      # and only relinks, which is far cheaper than a matrix of two cold ones.
      - name: Build the installers
        run: |
          set -euo pipefail
          mkdir -p out
          for app in admin pos; do
            echo "::group::$app"
            # The Windows icon is cut from the same artwork the PWA installs
            # with, so the two can never drift apart.
            npx --yes "$TAURI_CLI" icon "../$app/public/app_icon/production/icon-512.png" -o "src-tauri/icons/$app"
            npx --yes "$TAURI_CLI" build --config "src-tauri/tauri.$app.conf.json"
            mv src-tauri/target/release/bundle/nsis/*-setup.exe out/
            echo "::endgroup::"
          done
          ls -l out

      - name: Read the version
        id: version
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: organza-desktop-windows
          path: desktop/out/*.exe
          if-no-files-found: error

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Organza Desktop ${{ steps.version.outputs.version }} (Windows)
          # A build from anywhere but the default branch is a trial, and says so.
          prerelease: ${{ github.ref_name != github.event.repository.default_branch }}
          body: |
            Windows installers for the Organza admin and POS.

            Each one is a window around the live site, so it always shows the
            deployed version — reinstalling is only needed when this shell
            itself changes.

            Built from ${{ github.sha }}.
          files: desktop/out/*.exe
          fail_on_unmatched_files: true
