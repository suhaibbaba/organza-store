name: Deploy Sandbox
on:
  push:
    branches: [sandbox]
  workflow_dispatch:
concurrency:
  group: deploy-sandbox
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # No checkout: the VPS builds from its own clone, which must be unshallowed because the version is a commit count.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            DEPLOY_DIR="${{ vars.SANDBOX_DEPLOY_DIR }}"
            [ -n "$DEPLOY_DIR" ] || { echo "::error::Set the SANDBOX_DEPLOY_DIR repository variable to this stack's directory on the VPS."; exit 1; }
            cd "$DEPLOY_DIR"
            echo "==> Pulling latest 'sandbox' branch"
            git fetch origin sandbox
            git reset --hard origin/sandbox

            echo "==> Making sure the full history is here (the version is a commit count)"
            if [ -f "$(git rev-parse --git-dir)/shallow" ]; then
              echo "    shallow clone — unshallowing"
              git fetch --unshallow origin sandbox || git fetch --depth=2147483647 origin sandbox
            fi

            echo "==> Resolving app version"
            # One version for API and both frontends, so a mismatch exposes a stale build; mirrors shared/scripts/app-version.js.
            if command -v node >/dev/null 2>&1; then
              APP_VERSION="$(node shared/scripts/app-version.js backend)"
            else
              BASE="$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([0-9]\{1,\}\.[0-9]\{1,\}\).*/\1/p' backend/package.json | head -n 1)"
              APP_VERSION="${BASE:-0.0}.$(git rev-list --count HEAD)"
            fi
            export APP_VERSION
            echo "    APP_VERSION=$APP_VERSION"

            echo "==> Making sure the uploads volume belongs to the app user"
            # An existing uploads volume keeps its old root ownership, so hand it to uid 1000 once (guarded: never a chown per deploy).
            STACK_NAME="$(sed -n 's/^STACK_NAME=["\x27]\{0,1\}\([^"\x27]*\).*$/\1/p' .env.sandbox | head -n 1)"
            [ -n "$STACK_NAME" ] || { echo "::error::Set STACK_NAME in .env.sandbox (the compose project name the volumes carry)."; exit 1; }
            UPLOADS_VOLUME="${STACK_NAME}_sandbox_uploads"
            if docker volume inspect "$UPLOADS_VOLUME" >/dev/null 2>&1; then
              CURRENT_UID="$(docker run --rm -v "$UPLOADS_VOLUME":/vol node:20-slim stat -c '%u' /vol)"
              echo "    $UPLOADS_VOLUME is owned by uid $CURRENT_UID"
              if [ "$CURRENT_UID" != "1000" ]; then
                echo "    handing it to uid 1000 (the container's node user) — one time only"
                docker run --rm --user 0:0 -v "$UPLOADS_VOLUME":/vol node:20-slim chown -R 1000:1000 /vol
              fi
            else
              echo "    volume does not exist yet — Docker will create it owned by uid 1000"
            fi

            echo "==> Building + starting containers"
            docker compose -f docker-compose.sandbox.yml --env-file .env.sandbox up -d --build
            echo "==> Applying database migrations"
            sleep 5
            docker compose -f docker-compose.sandbox.yml --env-file .env.sandbox exec -T backend npx prisma migrate deploy
            echo "==> Creating essential data (settings, variant types, expense categories)"
            # Essential data only, once per database (backend/src/lib/bootstrap.ts); the demo seed is never reachable from a deploy.
            docker compose -f docker-compose.sandbox.yml --env-file .env.sandbox exec -T backend npm run bootstrap

            echo "==> Rebuilding the search index (Meilisearch)"
            # A failure here is a warning, not a failed deploy: search falls back to pg_trgm until the next run.
            REINDEXED=false
            for ATTEMPT in 1 2 3; do
              if docker compose -f docker-compose.sandbox.yml --env-file .env.sandbox exec -T backend npm run search:reindex; then
                REINDEXED=true
                break
              fi
              echo "    attempt $ATTEMPT failed — waiting for Meilisearch"
              sleep 5
            done
            if [ "$REINDEXED" != "true" ]; then
              echo "::warning::The search index was not rebuilt. Search still works through Postgres (pg_trgm)."
              echo "::warning::Check: docker compose -f docker-compose.sandbox.yml --env-file .env.sandbox logs meilisearch"
            fi

            echo "==> Rebuilding the numbered shawls' photos"
            # A warning, not a failed deploy: the lists show the plain photo until the next save or deploy.
            if ! docker compose -f docker-compose.sandbox.yml --env-file .env.sandbox exec -T backend npm run images:mark; then
              echo "::warning::The numbered photos were not rebuilt (npm run images:mark)."
            fi

            echo "==> Checking the uploads volume is mounted and writable"
            # A wrong UPLOAD_DIR silently writes photos into the container layer, so fail the deploy unless /health says uploads are writable.
            docker compose -f docker-compose.sandbox.yml --env-file .env.sandbox logs --tail 50 backend \
              | grep -i "Uploads directory" || true
            UPLOADS_OK="$(docker compose -f docker-compose.sandbox.yml --env-file .env.sandbox exec -T backend \
              node -e "fetch('http://localhost:4000/health').then(r=>r.json()).then(b=>console.log(b.data.uploadsWritable)).catch(()=>console.log('unreachable'))")"
            echo "    uploadsWritable=$UPLOADS_OK"
            if [ "$UPLOADS_OK" != "true" ]; then
              echo "::error::The API cannot write uploaded images. The code is deployed, but every"
              echo "::error::image upload will fail and any image uploaded since the last good deploy"
              echo "::error::may already be lost. Check the uploads volume mount and UPLOAD_DIR in"
              echo "::error::docker-compose.sandbox.yml — see ops/README.md."
              exit 1
            fi

            echo "==> Checking both apps were built as the SANDBOX"
            # NEXT_PUBLIC_APP_ENV is baked at build time and fails silently, so check the manifest says sandbox.
            for APP in admin pos; do
              MANIFEST="$(docker compose -f docker-compose.sandbox.yml --env-file .env.sandbox exec -T "$APP" \
                node -e "fetch('http://localhost:3000/manifest.webmanifest').then(r=>r.text()).then(t=>console.log(t)).catch(e=>console.log('unreachable: '+e.message))")"
              if ! printf '%s' "$MANIFEST" | grep -q "/app_icon/sandbox/"; then
                echo "::error::The $APP app is not serving the sandbox icons. It was built without"
                echo "::error::NEXT_PUBLIC_APP_ENV=sandbox, so it is wearing the LIVE SHOP's icons and"
                echo "::error::name on the sandbox — see docker-compose.sandbox.yml, service '$APP'."
                printf '%s\n' "$MANIFEST" | head -c 500
                exit 1
              fi
              echo "    $APP: sandbox icons ✓"
            done

            echo "==> Pruning old images"
            docker image prune -f

            echo "==> Capping the build cache"
            # Cap the build cache instead of emptying it, so the npm ci layer survives; the flag name differs between Docker versions.
            if docker builder prune --help 2>&1 | grep -q -- '--max-used-space'; then
              docker builder prune -f --max-used-space 10GB
            else
              docker builder prune -f --keep-storage 10GB
            fi
            docker system df

            echo "==> Done."
