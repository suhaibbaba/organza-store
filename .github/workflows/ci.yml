name: CI

on:
  push:
    branches: [rebuild]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: organza
          POSTGRES_PASSWORD: organza
          POSTGRES_DB: organza
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U organza" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://organza:organza@localhost:5432/organza
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @organza/shared build
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @organza/web build
      - run: pnpm --filter @organza/web check:safari

  images:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/api.Dockerfile -t organza-api .
      - run: docker build -f docker/web.Dockerfile -t organza-web .

  # The Windows app (phase 7). Compiles, lints and tests the Rust shell and builds an unsigned
  # installer to try on the shop PC. Signed release builds need the updater key (docs/handover.md).
  desktop-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @organza/shared build
      - run: pnpm --filter @organza/web build:desktop
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      - run: cargo test
        working-directory: apps/desktop/src-tauri
      - run: pnpm --filter @organza/desktop tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v4
        with:
          name: organza-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14

  # The same shell on Linux (where the till may move): compiles the CUPS printing path.
  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @organza/shared build
      - run: pnpm --filter @organza/web build:desktop
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      - run: cargo test
        working-directory: apps/desktop/src-tauri
