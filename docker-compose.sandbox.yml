# Organza — Sandbox stack (backend + Postgres for now)
# Run:  docker compose -f docker-compose.sandbox.yml --env-file .env.sandbox up -d --build
name: organza-sandbox

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - sandbox_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build:
      # context is the repo root, not ./backend: postinstall builds the
      # sibling ../shared package into backend/node_modules/@shared, so
      # shared/ must be inside the build context too.
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env.sandbox
    environment:
      # assembled here so backend always points at the compose DB
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - sandbox_uploads:/app/uploads     # keep uploaded images across rebuilds
    ports:
      - "127.0.0.1:14000:4000"           # sandbox range (leaves 4000 free for prod later)

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.sandbox.organza-moda.com
        NEXT_PUBLIC_DEFAULT_LOCALE: ar
        NEXT_PUBLIC_SUPPORTED_LOCALES: ar,en,he
        NEXT_PUBLIC_PROJECT_NAME: organza-sandbox-admin
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "127.0.0.1:13001:3000"

  pos:
    build:
      # context is the repo root for the same reason as backend/admin: the
      # build needs the sibling shared/ package.
      context: .
      dockerfile: pos/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.sandbox.organza-moda.com
        NEXT_PUBLIC_DEFAULT_LOCALE: ar
        NEXT_PUBLIC_SUPPORTED_LOCALES: ar,en,he
        NEXT_PUBLIC_PROJECT_NAME: organza-sandbox-pos
    restart: unless-stopped
    depends_on: [backend]
    # Camera scanning needs HTTPS (spec.md), so this port has to be served
    # through the TLS-terminating reverse proxy in front of it, not hit
    # directly over http://<vps>:13002.
    ports:
      - "127.0.0.1:13002:3000"

volumes:
  sandbox_db_data:
  sandbox_uploads:
