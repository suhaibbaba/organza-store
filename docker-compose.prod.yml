# STACK_NAME names the volumes: never change it on a running stack. Run with --env-file .env.production.
name: ${STACK_NAME:?set STACK_NAME in the stack env file}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      # postgres:16's data path; postgres 18+ moved PGDATA, so check this mount before any upgrade or data lands in the container.
      - prod_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build:
      # Context is the repo root: one npm workspace, one lockfile, and shared/ must be inside the build context.
      context: .
      dockerfile: backend/Dockerfile
      args:
        # Resolved by the deploy (the image has no git history); empty falls back to package.json's version.
        APP_VERSION: ${APP_VERSION:-}
    restart: unless-stopped
    # Every backend/.env.example setting, incl. email and TRUST_PROXY/TRUSTED_PROXY_IPS; the file lives on the VPS, never committed.
    env_file: .env.production
    environment:
      # assembled here so backend always points at the compose DB
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      # Absolute and set here, never in the env file: a relative UPLOAD_DIR once wrote every photo into the container and lost them.
      UPLOAD_DIR: /app/uploads
      # Set here, not in the env file: only APP_ENV (never NODE_ENV) makes db:reset refuse the live shop's database.
      APP_ENV: production
      # Search engine on the compose network. No depends_on: if it is down the API falls back to pg_trgm.
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - prod_uploads:/app/uploads
    ports:
      - "127.0.0.1:4000:4000" # production range (the sandbox sits on 14000/13001/13002)

  meilisearch:
    image: getmeili/meilisearch:v1.55.1
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      # At least 16 bytes; set it in .env.production on the VPS. A missing key stops the deploy before anything changes.
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env.production}
      MEILI_NO_ANALYTICS: "true"
      MEILI_DB_PATH: /meili_data/data.ms
    volumes:
      # Rebuildable from the database (npm run search:reindex), but kept so a restart does not start empty.
      - prod_search_data:/meili_data
    # Internal only: no published port, the backend reaches it by service name.

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL in the stack env file}
        NEXT_PUBLIC_DEFAULT_LOCALE: ar
        NEXT_PUBLIC_SUPPORTED_LOCALES: ar,en,he
        NEXT_PUBLIC_PROJECT_NAME: ${STACK_NAME}-admin
        NEXT_PUBLIC_APP_NAME: ${ADMIN_APP_NAME:-}
        # Plain icons and no environment chip; baked at build time, so changing it needs a rebuild.
        NEXT_PUBLIC_APP_ENV: production
        # Same number as the backend's, resolved once by the deploy.
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-}
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "127.0.0.1:3001:3000"

  pos:
    build:
      context: .
      dockerfile: pos/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL in the stack env file}
        NEXT_PUBLIC_DEFAULT_LOCALE: ar
        NEXT_PUBLIC_SUPPORTED_LOCALES: ar,en,he
        NEXT_PUBLIC_PROJECT_NAME: ${STACK_NAME}-pos
        NEXT_PUBLIC_APP_NAME: ${POS_APP_NAME:-}
        # Plain icons and no environment chip; baked at build time, so changing it needs a rebuild.
        NEXT_PUBLIC_APP_ENV: production
        # Same number as the backend's, resolved once by the deploy.
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-}
    restart: unless-stopped
    depends_on: [backend]
    # Camera scanning needs HTTPS: serve this only through the TLS reverse proxy.
    ports:
      - "127.0.0.1:3002:3000"

# DO NOT rename these keys or STACK_NAME: they name the real volumes, and a new name means empty ones. Never `down -v`.
volumes:
  prod_db_data:
  prod_uploads:
  prod_search_data:
