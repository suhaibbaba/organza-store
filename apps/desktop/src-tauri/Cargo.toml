[package]
name = "organza-desktop"
version = "0.1.0"
description = "Organza for Windows: the web app with direct receipt printing and secure sign-in"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "organza_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "apple-native"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Printing"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
